<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GitHub Profile Analyzer</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #30363d;
            text-align: center;
            width: 380px;
        }
        h1 { font-size: 22px; margin-bottom: 8px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: #238636;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #2ea043; }
        .error { color: #f85149; font-size: 14px; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐙 GitHub Profile Analyzer</h1>
        <p>Введи никнейм — получишь графики по языкам, звёздам и активности</p>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form action="{{ url_for('go') }}" method="post">
            <input type="text" name="username" placeholder="например, torvalds" required>
            <button type="submit">Анализировать</button>
        </form>
    </div>
</body>
</html>
